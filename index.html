<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Math Poo</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17301f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Math Poo">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#e6eee4;--ink:#17301f;--mute:#5d7463;--card:#f6faf4;--line:#c9d7c6;--hit:#1f9d55;--miss:#e0405a;
box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#0f1c14;--ink:#e3efe0;--mute:#8aa38f;--card:#172a1d;--line:#25402d;--hit:#4cd685;--miss:#ff6b84}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html{height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;overscroll-behavior:none}
#app{height:100%;max-width:460px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;position:relative}
.top{display:flex;align-items:center;justify-content:space-between}
.lvl{font-weight:800;font-size:20px}
.lvlctl{display:flex;gap:6px}
.rb{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:700 18px inherit;cursor:pointer}
.chips{display:flex;gap:8px}
.chip{flex:1;height:38px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--mute);font:700 20px inherit;cursor:pointer;transition:all .15s}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--hit);transition:width .3s ease}
.stats{display:grid;grid-template-columns:repeat(5,1fr);text-align:center;color:var(--mute);font-size:12px}
.stats b{display:block;color:var(--ink);font-size:17px;font-weight:700}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#q{font-size:clamp(46px,14vw,68px);font-weight:800;letter-spacing:-.02em;line-height:1.05;text-align:center}
#q.in{animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateY(12px) scale(.97)}}
#ans{min-width:130px;height:66px;padding:0 22px;display:flex;align-items:center;justify-content:center;border-radius:18px;background:var(--card);border:2px solid var(--line);font-size:40px;font-weight:700;transition:border-color .12s,background .12s,transform .12s}
#ans.hit{border-color:var(--hit);background:color-mix(in srgb,var(--hit) 20%,var(--card));transform:scale(1.06)}
#ans.miss{border-color:var(--miss);background:color-mix(in srgb,var(--miss) 16%,var(--card));animation:sh .3s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-10px);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-weight:800;font-size:18px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{height:clamp(52px,9vh,66px);border:0;border-radius:16px;background:var(--card);color:var(--ink);font:700 27px inherit;cursor:pointer;box-shadow:0 0 0 1.5px var(--line) inset;transition:transform .06s,background .1s}
.pad button:active{transform:scale(.94);background:var(--line)}
.pad .skip{font-size:16px;color:var(--mute)}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute)}
.foot div{display:flex;gap:14px}
.foot button{background:none;border:0;color:var(--mute);font:600 13px inherit;cursor:pointer;padding:4px 0}
.foot button.off{text-decoration:line-through;opacity:.6}
#inst{display:none}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="lvl">Level <span id="lv">1</span></div>
    <div class="lvlctl"><button class="rb" id="dn" aria-label="Easier">−</button><button class="rb" id="up" aria-label="Harder">+</button></div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="bar"><i id="pg"></i></div>
  <div class="stats">
    <span><b id="sv">0</b>solved</span><span><b id="st">0</b>streak</span><span><b id="bs">0</b>best</span><span><b id="av">–</b>avg sec</span><span><b id="ac">–</b>accuracy</span>
  </div>
  <div class="stage"><div id="q">…</div><div id="ans" aria-live="polite"></div></div>
  <div id="toast"></div>
  <div class="pad" id="pad"></div>
  <div class="foot">
    <div><button id="snd">Sound</button><button id="hap">Haptics</button><button id="inst">Install</button></div>
    <button id="rs">Reset</button>
  </div>
</div>
<script>
(function(){
var K="mathflow-v1",PER=8,OPS=["+","−","×","÷"];
var P={best:0,total:0,lvl:1,mode:"mix",snd:1,hap:1};
try{var sv=JSON.parse(localStorage.getItem(K));if(sv)for(var k in sv)P[k]=sv[k]}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(P))}catch(e){}}
var S,cur,typed="",lock=false,t0=0,ac=null;
function fresh(){S={solved:0,streak:0,tries:0,hits:0,inLvl:0,tsum:0,tn:0}}fresh();
var $=function(i){return document.getElementById(i)};
function r(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function gen(L){
  var on=P.mode==="mix"?OPS:[OPS[P.mode]],o=on[r(0,on.length-1)],a,b,ans,m;
  if(o==="+"){m=8+L*10;a=r(2,m);b=r(2,m);ans=a+b}
  else if(o==="−"){m=10+L*10;a=r(5,m);b=r(2,a-1);ans=a-b}
  else if(o==="×"){var lo=Math.min(4+L,12);
    if(L<=8){a=r(2,lo);b=r(2,lo)}else{a=r(10,10+(L-8)*8);b=r(2,Math.min(9,3+Math.floor(L/2)))}
    ans=a*b}
  else{var d=Math.min(3+L,12),q=L<=8?r(2,Math.min(3+L,12)):r(2,12+(L-8)*3);b=r(2,d);a=b*q;ans=q}
  return{t:a+" "+o+" "+b,a:ans}
}
function next(){cur=gen(P.lvl);typed="";lock=false;var q=$("q");q.textContent=cur.t;q.classList.remove("in");void q.offsetWidth;q.classList.add("in");show();draw();t0=Date.now()}
function show(c){var e=$("ans");e.textContent=typed;e.className=c||""}
function draw(){
  $("lv").textContent=P.lvl;$("sv").textContent=S.solved;$("st").textContent=S.streak;$("bs").textContent=P.best;
  $("av").textContent=S.tn?(S.tsum/S.tn/1000).toFixed(1):"–";
  $("ac").textContent=S.tries?Math.round(S.hits/S.tries*100)+"%":"–";
  $("pg").style.width=(S.inLvl/PER*100)+"%"
}
var tt;function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("show")},1100)}
function beep(f,d){if(!P.snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type="sine";g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function buzz(n){if(P.hap&&navigator.vibrate)navigator.vibrate(n)}
function press(k){
  if(lock)return;
  if(k==="del"){typed=typed.slice(0,-1);show();return}
  if(k==="skip"){S.streak=0;next();return}
  if(typed.length>=7)return;
  typed+=k;show();
  var want=String(cur.a);
  if(typed===want){
    lock=true;S.tries++;S.hits++;S.solved++;S.streak++;S.inLvl++;P.total++;
    S.tsum+=Math.min(Date.now()-t0,15000);S.tn++;
    var up=false;
    if(S.streak>P.best)P.best=S.streak;
    if(S.inLvl>=PER){P.lvl++;S.inLvl=0;up=true}
    save();show("hit");draw();beep(up?880:660,.1);buzz(12);
    if(up)toast("Level "+P.lvl);else if(S.streak%10===0)toast(S.streak+" in a row");
    setTimeout(next,170)
  }else if(typed.length>=want.length){
    lock=true;S.tries++;S.streak=0;show("miss");draw();beep(180,.18);buzz([30,40,30]);
    setTimeout(function(){typed="";lock=false;show()},330)
  }
}
var keys=["1","2","3","4","5","6","7","8","9","skip","0","del"];
keys.forEach(function(k){
  var b=document.createElement("button");b.textContent=k==="del"?"⌫":k==="skip"?"Skip":k;
  if(k==="skip")b.className="skip";
  b.setAttribute("aria-label",k==="del"?"Delete":k==="skip"?"Skip question":k);
  b.onclick=function(){press(k)};$("pad").appendChild(b)
});
var CH=[["Mix","mix"],["+",0],["−",1],["×",2],["÷",3]];
function chipSync(){var c=$("chips").children;for(var j=0;j<c.length;j++)c[j].classList.toggle("on",CH[j][1]===P.mode)}
CH.forEach(function(c){
  var b=document.createElement("button");b.className="chip";b.textContent=c[0];
  b.setAttribute("aria-label",c[1]==="mix"?"All operations":"Only "+c[0]);
  b.onclick=function(){P.mode=c[1];chipSync();save();next()};$("chips").appendChild(b)
});
chipSync();
document.addEventListener("keydown",function(e){
  if(e.key>="0"&&e.key<="9")press(e.key);
  else if(e.key==="Backspace")press("del");
  else if(e.key==="Enter"||e.key===" "){e.preventDefault();press("skip")}
});
function tog(id,key){var b=$(id);function sync(){b.classList.toggle("off",!P[key])}sync();b.onclick=function(){P[key]=P[key]?0:1;sync();save();if(key==="snd")beep(660,.08);if(key==="hap")buzz(15)}}
tog("snd","snd");tog("hap","hap");
$("up").onclick=function(){P.lvl++;S.inLvl=0;save();next()};
$("dn").onclick=function(){if(P.lvl>1){P.lvl--;S.inLvl=0;save();next()}};
$("rs").onclick=function(){P.lvl=1;fresh();save();next()};
var dp;window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e;$("inst").style.display="inline"});
$("inst").onclick=function(){if(dp){dp.prompt();dp=null;$("inst").style.display="none"}};
if("serviceWorker"in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
next();
})();
</script>
</body>
</html>
